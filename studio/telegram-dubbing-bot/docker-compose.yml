services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: pird_telegram_bot_api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
      - TELEGRAM_STAT=1
    volumes:
      - ./telegram-data:/var/lib/telegram-bot-api
    command: --api-id=${TELEGRAM_API_ID} --api-hash=${TELEGRAM_API_HASH} --local --dir=/var/lib/telegram-bot-api
    expose:
      - "8081"
